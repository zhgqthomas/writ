name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - .github/workflows/**
      - .dockerignore
      - docker/**
      - coordinator/**
      - frontend/**
      - doc-extract/**
      - scripts/**
  pull_request:
    paths:
      - .github/workflows/**
      - .dockerignore
      - docker/**
      - coordinator/**
      - frontend/**
      - doc-extract/**
      - scripts/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a validated version tag after CI, E2E and image tests pass
        type: boolean
        default: false
      tag:
        description: Existing vMAJOR.MINOR.PATCH[-prerelease] tag (required to publish from a branch)
        type: string
        default: ""
      agent_repo:
        description: Agent release repository (defaults to this owner's writ-agent)
        type: string
        default: ""
      agent_tag:
        description: Agent version to validate; empty resolves the latest stable release once
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Only superseded PR checks share a group. Publication has its own queue below,
# so a main-branch check can never replace a pending version release.
concurrency:
  group: docker-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Validate source and publication request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Resolve the exact commit
        id: release
        env:
          RELEASE_REF: ${{ inputs.tag || github.ref }}
          PUBLISH: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: python3 scripts/release_policy.py prepare --ref "$RELEASE_REF" --publish "$PUBLISH"

  checks:
    name: Release CI
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: read

  e2e:
    name: Release integration
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/release-e2e.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      agent_repo: ${{ inputs.agent_repo || format('{0}/writ-agent', github.repository_owner) }}
      agent_tag: ${{ inputs.agent_tag || '' }}
    permissions:
      contents: read

  build:
    needs: [prepare, checks, e2e]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.publish != 'true' || (needs.checks.result == 'success' && needs.e2e.result == 'success')) }}
    name: ${{ matrix.image }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [coordinator, doc-extract]
        # Native runners avoid emulating the OCR stack and frontend build.
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.image }}
        run: echo "name=ghcr.io/${OWNER,,}/writ-${COMPONENT}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and load the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          platforms: linux/${{ matrix.platform.arch }}
          load: true
          tags: writ-${{ matrix.image }}:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=writ-${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=writ-${{ matrix.image }}-${{ matrix.platform.arch }}

      - name: Smoke test the runtime image
        env:
          COMPONENT: ${{ matrix.image }}
        run: bash scripts/smoke-docker-image.sh "writ-${COMPONENT}:ci" "$COMPONENT"

      - name: Save the tested image for publication
        if: needs.prepare.outputs.publish == 'true'
        env:
          COMPONENT: ${{ matrix.image }}
          ARCH: ${{ matrix.platform.arch }}
        run: docker save "writ-${COMPONENT}:ci" | gzip > "$RUNNER_TEMP/image-$ARCH.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          name: image-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.platform.arch }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish ${{ matrix.image }} (amd64 + arm64)
    needs: [prepare, checks, e2e, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: docker-publish-${{ matrix.image }}
      # Retain pending releases (the default single-slot queue replaces them).
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [coordinator, doc-extract]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.image }}
        run: echo "name=ghcr.io/${OWNER,,}/writ-${COMPONENT}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/images
          pattern: image-${{ matrix.image }}-*
          merge-multiple: true

      - name: Publish versioned images and advance stable aliases
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.image }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          # This runs AFTER entering the publication queue: a newer tag can have
          # arrived while this release was building or waiting.
          git fetch --force --prune --prune-tags origin '+refs/tags/*:refs/tags/*'
          python3 scripts/release_policy.py verify --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
          sources=()
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/images/image-$arch.tar.gz"
            candidate="$IMAGE:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$arch"
            docker tag "writ-${COMPONENT}:ci" "$candidate"
            docker push "$candidate"
            digest=$(docker image inspect "$candidate" --format '{{index .RepoDigests 0}}')
            sources+=("$digest")
          done
          current=unknown
          if docker buildx imagetools inspect "$IMAGE:latest" --raw > "$RUNNER_TEMP/latest.json" 2> "$RUNNER_TEMP/latest.err"; then
            current=$(jq -r '.annotations["org.opencontainers.image.version"] // "unknown"' "$RUNNER_TEMP/latest.json")
          elif grep -qiE 'manifest unknown|not found|name unknown' "$RUNNER_TEMP/latest.err"; then
            current=absent
          else
            cat "$RUNNER_TEMP/latest.err" >&2
            exit 1
          fi
          python3 scripts/release_policy.py tags --owner "$OWNER" --component "$COMPONENT" \
            --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --current-version "$current" > "$RUNNER_TEMP/tags.txt"
          tags=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=(--tag "$tag")
          done < "$RUNNER_TEMP/tags.txt"
          candidate="$IMAGE:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "$candidate" \
            --annotation "index:org.opencontainers.image.version=$RELEASE_TAG" \
            --annotation "index:org.opencontainers.image.revision=$RELEASE_SHA" "${sources[@]}"
          docker buildx imagetools inspect "$candidate" --raw \
            | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | unique | sort == ["amd64", "arm64"]'
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.version=$RELEASE_TAG" \
            --annotation "index:org.opencontainers.image.revision=$RELEASE_SHA" "$candidate"
          printf '### %s\n\nValidated commit: `%s`\n\nPlatforms: `linux/amd64`, `linux/arm64`\n\n' "$IMAGE" "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r tag; do
            printf -- '- `%s`\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/tags.txt"
          if [[ "$current" == unknown ]]; then
            echo 'Existing latest has no version annotation; versioned images published, latest preserved.' >> "$GITHUB_STEP_SUMMARY"
          fi
